<script>
  const BOT_USERNAME = "PoinGameBot";

  const SUPABASE_URL = "https://wnvjdbdsbfnrnujywebt.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FWvovAJQZM_NzLGzxkdWHQ_9JGR4lZH";

  const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

  if (tg) {
    tg.ready();
    tg.expand();
  }

 
  const set = (key, value) =>
    localStorage.setItem("pw_" + key, String(value));

  let balance = Number(get("balance") || 0);
  let lastHourly = Number(get("lastHourly") || Date.now());
  let lastDaily = get("lastDaily") || "";
  let completed = JSON.parse(get("completed") || "[]");

  const user = tg && tg.initDataUnsafe
    ? tg.initDataUnsafe.user
    : null;

  const userId = user && user.id ? user.id : null;
  const firstName = user && user.first_name
    ? user.first_name
    : "بازیکن";

  async function verifyTelegramSession() {
    if (!tg || !tg.initData) {
      console.log("بازی را از داخل تلگرام باز کن.");
      return;
    }

    try {
      const response = await fetch(
        SUPABASE_URL + "/functions/v1/telegram-auth",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify({
            initData: tg.initData
          })
        }
      );

      const result = await response.json();
      console.log(
        "نتیجه اتصال تلگرام:",
        response.status,
        result
      );
    } catch (error) {
      console.error("خطای اتصال:", error);
    }
  }

  document.getElementById("playerName").textContent = firstName;
  document.getElementById("playerId").textContent =
    userId || "در دسترس نیست";

  function save() {
    set("balance", balance);
    set("lastHourly", lastHourly);
    set("lastDaily", lastDaily);
    set("completed", JSON.stringify(completed));
    render();
  }

  function render() {
    document.getElementById("balance").textContent =
      balance.toLocaleString() + " PT";

    document.getElementById("rankBalance").textContent =
      balance.toLocaleString() + " PT";

    const elapsed = Math.max(0, Date.now() - lastHourly);
    const hours = Math.floor(elapsed / 3600000);
    const minutes = Math.floor((elapsed % 3600000) / 60000);
    const progress = Math.floor(
      ((elapsed % 3600000) / 3600000) * 100
    );

    document.getElementById("hourInfo").textContent =
      hours > 0
        ? hours + " ساعت امتیاز آمادهٔ دریافت داری"
        : "امتیاز بعدی در " + (59 - minutes) +
          " دقیقه آماده می‌شود";

    document.getElementById("progress").style.width =
      progress + "%";

    document.getElementById("claimHourly").disabled =
      hours < 1;

    const today = new Date().toISOString().slice(0, 10);

    document.getElementById("dailyButton").disabled =
      lastDaily === today;

    document.getElementById("dailyButton").textContent =
      lastDaily === today
        ? "امروز دریافت شد"
        : "گرفتن جایزه";

    ["task1", "task2", "task3"].forEach(id => {
      const btn = document.getElementById(id);
      btn.disabled = completed.includes(id);
      btn.textContent = completed.includes(id)
        ? "دریافت شد"
        : "دریافت";
    });

    const link = userId && BOT_USERNAME
      ? "https://t.me/" + BOT_USERNAME +
        "?startapp=" + userId
      : "";

    document.getElementById("inviteLink").value = link;
  }

  function claimHourly() {
    const hours = Math.floor(
      (Date.now() - lastHourly) / 3600000
    );

    if (hours < 1) {
      alert("هنوز یک ساعت کامل نشده است.");
      return;
    }

    balance += hours * 10;
    lastHourly += hours * 3600000;
    save();
    alert((hours * 10) + " امتیاز گرفتی!");
  }

  function claimDaily() {
    const today = new Date().toISOString().slice(0, 10);

    if (lastDaily === today) return;

    balance += 100;
    lastDaily = today;
    save();
    alert("جایزهٔ روزانهٔ ۱۰۰ امتیازی دریافت شد!");
  }

  function completeTask(id, points) {
    if (completed.includes(id)) return;

    completed.push(id);
    balance += points;
    save();
    alert(points + " امتیاز آزمایشی دریافت شد!");
  }

  function showPage(id, button) {
    document.querySelectorAll(".page").forEach(page =>
      page.classList.remove("active")
    );

    document.getElementById(id).classList.add("active");

    document.querySelectorAll(".nav button").forEach(btn =>
      btn.classList.remove("active")
    );

    button.classList.add("active");
  }

  async function copyInvite() {
    const link = document.getElementById("inviteLink").value;

    if (!link) {
      alert("بازی را از داخل تلگرام باز کن.");
      return;
    }

    try {
      await navigator.clipboard.writeText(link);
      alert("لینک کاپی شد!");
    } catch (error) {
      document.getElementById("inviteLink").select();
      alert("لینک را انتخاب کن و Copy را بزن.");
    }
  }

  function shareInvite() {
    const link = document.getElementById("inviteLink").value;

    if (!link) {
      alert("بازی را از داخل تلگرام باز کن.");
      return;
    }

    const shareUrl =
      "https://t.me/share/url?url=" +
      encodeURIComponent(link) +
      "&text=" +
      encodeURIComponent("بیا POINT WORLD را امتحان کن!");

    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(shareUrl);
    } else {
      window.open(shareUrl, "_blank");
    }
  }

  render();
  verifyTelegramSession();
  setInterval(render, 60000);
</script>
